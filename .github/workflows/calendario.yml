name: Actualizar fechas y portadas

on:
  schedule:
    # Lunes a las 06:15 UTC. Una vez por semana es de sobra: las editoriales
    # anuncian con meses de antelación y así no se molesta al servidor.
    - cron: '15 6 * * 1'
  push:
    # Al publicar la colección, para traer la ficha de las series nuevas sin
    # esperar al lunes. Solo se descargan las que falten o estén caducadas.
    branches: [main]
    paths: ['data/coleccion.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cada paso que sale a internet se marca como «puede fallar sin abortar»,
      # y al final se mira si alguno falló. Sin esto, en agosto de 2026 un
      # cambio de nada en los enlaces de ListadoManga dejó el catálogo en cero,
      # el primer paso cortó el job y estuvimos cinco días sin fechas ni
      # portadas de los tomos nuevos.
      - name: Descargar el catálogo de ediciones
        id: indice
        continue-on-error: true
        run: python3 scripts/actualizar_indice.py

      # El catálogo solo se usa para buscar ediciones por nombre: si no se ha
      # podido actualizar, el anterior sigue sirviendo y las fichas —que es lo
      # que trae fechas y portadas— se descargan igual.
      - name: Descargar las fechas
        id: fechas
        continue-on-error: true
        run: python3 scripts/actualizar_calendario.py --verbose

      # Pillow solo se usa para reducir las portadas de editorial: Planeta las
      # sirve a 2000 px y sin reducir ocuparían 10 MB en el repo.
      - name: Preparar Pillow
        run: pip install --quiet Pillow

      - name: Descargar las portadas de las editoriales
        id: portadas
        continue-on-error: true
        run: python3 scripts/actualizar_portadas.py --verbose

      - name: Publicar los cambios
        run: |
          # Las portadas van incluidas: calendario.json apunta a data/portadas/,
          # y si no se suben, la web queda con imágenes rotas.
          git add -A data/calendario.json data/listadomanga-indice.json data/portadas \
                     data/portadas-editorial.json data/portadas-serie
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos de ListadoManga"
          git push

      # Va después de publicar, para que lo que sí se haya podido descargar
      # llegue a la web igualmente. Y en rojo de verdad: «continue-on-error» por
      # sí solo deja el run en verde, así que una fuente rota podía llevar
      # semanas sin que se notara.
      - name: Avisar si alguna fuente ha fallado
        if: >-
          steps.indice.outcome == 'failure' ||
          steps.fechas.outcome == 'failure' ||
          steps.portadas.outcome == 'failure'
        run: |
          echo "::error::Alguna fuente no ha devuelto datos. Lo normal es que"
          echo "::error::hayan cambiado su web y haya que revisar el script."
          echo "  catálogo de ediciones: ${{ steps.indice.outcome }}"
          echo "  fechas de las fichas:  ${{ steps.fechas.outcome }}"
          echo "  portadas de editorial: ${{ steps.portadas.outcome }}"
          exit 1
