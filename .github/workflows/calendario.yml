name: Actualizar fechas desde ListadoManga

on:
  schedule:
    # Lunes a las 06:15 UTC. Una vez por semana es de sobra: las editoriales
    # anuncian con meses de antelación y así no se molesta al servidor.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Descargar el catálogo de ediciones
        run: python3 scripts/actualizar_indice.py

      - name: Descargar las fechas
        run: python3 scripts/actualizar_calendario.py --verbose

      - name: Publicar los cambios
        run: |
          if git diff --quiet -- data/calendario.json data/listadomanga-indice.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendario.json data/listadomanga-indice.json
          git commit -m "Actualizar datos de ListadoManga"
          git push
